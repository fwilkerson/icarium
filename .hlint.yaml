# HLint configuration — start permissive, tighten over time.
# Add ignores here for suggestions we explicitly disagree with.

- ignore: {name: Use camelCase}           # snake_case appears in TOML/DB key strings
- ignore: {name: Redundant $}             # common style choice in this codebase
- ignore: {name: Use newtype instead of data}   # single-field option records; data is intentional
- ignore: {name: Use <$>}                 # fmap f $ x style is deliberate in Git helpers
- ignore: {name: Use list comprehension}  # if-then-else is clearer than list guard here
