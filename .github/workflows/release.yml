name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  release:
    name: Build (${{ matrix.binary_name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: icarium-linux-x86_64
          - os: macos-latest
            binary_name: icarium-macos-arm64

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: haskell-actions/setup@58be2b9bbc84559bc01f4e2138804d4a78e04fe4  # v2.11.0
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.14'

      - name: Build
        run: cabal update && cabal build exe:icarium

      - name: Prepare binary
        run: |
          BIN=$(cabal list-bin exe:icarium)
          cp "$BIN" "${{ matrix.binary_name }}"
          strip "${{ matrix.binary_name }}"

      - uses: softprops/action-gh-release@26e8ad27a09a225049a7075d7ec1caa2df6ff332  # v2.6.0
        with:
          files: icarium-*
