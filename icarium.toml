[project]
integration_branch = "main"

[commands]
# make install also drops bin/icarium, which the CLI integration tests
# invoke; a bare `cabal build all` leaves fresh worktrees without it.
build = "make install"
test  = "cabal test all"

[dispatch]
model  = "claude-opus-4-8"
effort = "medium"
tools = ["Read", "Edit", "Write", "Grep", "Glob", "Bash", "Skill"]
agreement_path = ".icarium/agreement.md"
allowed_tools = [
  "Read", "Edit", "Write", "Grep", "Glob",
  "Bash(git:*)", "Bash(cabal:*)", "Bash(make:*)",
  # Loops and $(...) never decompose for prefix matching, so a repeat-the-suite
  # command can only be reached as a named script. Both spellings: the matcher
  # is literal, and `./scripts/...` is the reflex.
  "Bash(scripts/flake-check.sh:*)", "Bash(./scripts/flake-check.sh:*)",
]
scratch_dir = ".icarium/scratch"
max_minutes_per_dispatch = 30
max_minutes_per_gate     = 20
heartbeat_stale_seconds  = 300
log_retention_runs       = 25
# Provision the pinned fourmolu into each worktree; the pre-commit hook
# needs it and make install does not reproduce it.
worktree_setup = "scripts/worktree-init.sh"

[categories]
domains     = ["cli", "dispatch", "storage", "workflow"]
disciplines = ["haskell", "ops", "refinement"]
kinds       = ["bug", "enhancement", "chore", "refactor", "doc"]

[review]
enabled      = true
model        = "claude-sonnet-5"
effort       = "medium"
max_attempts = 2
