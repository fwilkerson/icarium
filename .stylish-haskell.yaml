# stylish-haskell configuration for icarium
#
# Scope: tidy imports and align record fields only.
# Expression-level rewrites (unicode_syntax, case alignment, top-level
# pattern alignment) are intentionally disabled to preserve hand-aligned
# applicative chains in Icarium.Config and similar modules.

steps:

  # Align record field declarations in data types.
  # cases and top_level_patterns are off — no expression-level changes.
  - simple_align:
      cases: false
      top_level_patterns: false
      records: true

  # Tidy import sections: align all imports globally, one per line.
  - imports:
      align: global
      list_align: after_alias
      pad_module_names: true
      long_list_align: inline
      empty_list_align: inherit
      list_padding: 4
      separate_lists: true
      space_surround: false

  # Strip trailing whitespace — cosmetic only, never changes semantics.
  - trailing_whitespace: {}

# Do NOT include: language_pragmas, unicode_syntax, tabs, or any other
# step that touches non-import regions.

columns: 100
newline: native
language_extensions: []
